<section class="px-[68px] py-8">
  <div class="mb-6 flex items-center justify-between">
    <h2 class="text-2xl font-extrabold uppercase tracking-wider text-white">COMING SOON...</h2>
    <a routerLink="/coming-soon" class="text-sm font-semibold text-[#EC3013]">See all</a>
  </div>

  <div class="relative">
    <div 
      class="pointer-events-none absolute left-0 top-0 bottom-0 w-28 bg-gradient-to-r from-[#0A0E17] via-[#0A0E17]/80 to-transparent z-10 transition-opacity duration-300"
      [class.opacity-0]="!canScrollLeft()"
    ></div>

    <div 
      class="pointer-events-none absolute right-0 top-0 bottom-0 w-48 bg-gradient-to-l from-[#0A0E17] via-[#0A0E17]/85 to-transparent z-10 transition-opacity duration-300"
      [class.opacity-0]="!canScrollRight()"
    ></div>

    <div 
      #carousel 
      (scroll)="onScroll(carousel)"
      class="flex gap-5 overflow-x-auto scroll-smooth [&::-webkit-scrollbar]:hidden"
    >
      @for (m of movies(); track m.id) {
        <article class="group flex h-[160px] w-[470px] shrink-0 gap-4 rounded-[20px] bg-[#1E2031] p-3 transition-transform duration-300 hover:-translate-y-0.5">
          <div class="relative h-full w-[230px] shrink-0 overflow-hidden rounded-[14px]">
            <img
              [src]="m.backdropUrl"
              class="h-full w-full object-cover transition-transform duration-300 ease-out"
            />
          </div>

          <div class="flex flex-1 flex-col justify-between py-0.5">
            <div>
              <p class="text-xs font-bold uppercase tracking-wider text-[#EC3013]">
                IN CINEMAS {{ m.releaseDate | date: 'd MMMM' | uppercase }}
              </p>

              <h3 class="mt-1 truncate text-xs font-extrabold text-white" [title]="m.title">
                {{ m.title }}
              </h3>

              <p class="mt-1 text-xs text-[#A9A9A9]">
                {{ m.genres[0]?.name || 'Feature' }} · {{ m.runtimeMinutes }} min
              </p>

              <span class="mt-1 inline-block w-fit rounded-full bg-[#EC3013]/10 px-2 py-1 text-[10px] font-xs text-[#EC3013]">
                {{ m.ageRating.code }}
              </span>
            </div>

            <button
              type="button"
              (click)="toggleNotify(m)"
              class="mt-5 flex w-fit cursor-pointer items-center gap-1.5 rounded-full border border-[#A9A9A9] px-3.5 py-1.5 text-xs font-semibold text-white transition-all duration-200 hover:bg-[#A9A9A9]/15 active:scale-95"
              [class.text-[#EC3013]]="m.isNotified"
              [class.bg-[#A9A9A9]/15]="m.isNotified"
            >
              <img src="Bell.svg" alt="">
              <span>{{ m.isNotified ? 'Notified' : 'Notify Me' }}</span>
            </button>
          </div>
        </article>
      }
    </div>

    <button
      type="button"
      class="absolute -left-5 top-1/2 -translate-y-1/2 z-10 flex h-[42px] w-[42px] cursor-pointer items-center justify-center rounded-full bg-white/10 backdrop-blur-md hover:bg-white/5 transition-all duration-400"
      [class.opacity-0]="!canScrollLeft()"
      [class.pointer-events-none]="!canScrollLeft()"
      (click)="scroll(carousel, 'left')"
    >
      <img src="Arrow-Left.svg" alt="" class="h-[14px] w-[7px]">
    </button>

    <button
      type="button"
      class="absolute -right-5 top-1/2 -translate-y-1/2 z-10 flex h-[42px] w-[42px] cursor-pointer items-center justify-center rounded-full bg-white/10 backdrop-blur-md hover:bg-white/5 transition-all duration-400"
      [class.opacity-0]="!canScrollRight()"
      [class.pointer-events-none]="!canScrollRight()"
      (click)="scroll(carousel, 'right')"
    >
      <img src="Arrow-Right.svg" alt="" class="h-[14px] w-[7px]">
    </button>
  </div>
</section>
